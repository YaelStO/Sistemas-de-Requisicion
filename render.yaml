# Render Blueprint — Backend (Spring Boot)
# Este archivo debe estar en la RAÍZ del repo.
# 1) En Render elige "New > Blueprint" y conéctalo a tu repo (lo detecta solo).
# 2) Render te pedirá completar las variables marcadas con "sync: false".
# 3) Después de crear el servicio, copia su URL (https://xxx.onrender.com) en
#    APP_BASE_URL y añádela (junto a la URL de Vercel) en CORS_ALLOWED_ORIGINS.

services:
  - type: web
    name: sistemas-de-requisicion
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/catalogo/partidas
    autoDeploy: true
    envVars:
      # --- Conexión a la base de datos (Supabase/Neon) ---
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # --- Seguridad del backend ---
      - key: JWT_SECRET
        sync: false
      # --- URLs públicas ---
      - key: APP_BASE_URL
        value: https://sistemas-de-requisicion.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,http://localhost:4000,https://requisiciones-frontend.vercel.app
      # --- Subida de PDFs (disco efímero en Render) ---
      - key: UPLOAD_DIR
        value: /tmp/uploads/cotizaciones
